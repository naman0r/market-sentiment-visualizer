version: "3.9"

# Docker Compose lets you run both backend and frontend with a single command:
#   docker-compose up
#
# This is optional — you can also run each service manually (see README).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount the cache directory so it persists between restarts
      - ./backend/.cache:/app/.cache
    environment:
      - CACHE_TTL=900
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
